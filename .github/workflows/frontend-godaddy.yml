name: Frontend GoDaddy

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-godaddy.yml"
      - ".github/scripts/deploy-godaddy-frontend.sh"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-godaddy.yml"
      - ".github/scripts/deploy-godaddy-frontend.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_BACKEND_URL: https://qxcqywgrw1.c40.airoapp.ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Production install and build
        run: rm -rf node_modules .next && npm ci --omit=dev && npm run build && test -f .next/BUILD_ID && test -f server.js

  deploy:
    needs: verify
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: godaddy/cli/action@action-v1
      - name: Upload frontend and publish
        env:
          GDDY_PAT: ${{ secrets.GDDY_PAT }}
          GDDY_PAT_PROD: ${{ secrets.GDDY_PAT }}
          GODADDY_APP_ID: NODEJS-ik3po8u6c4
          NEXT_PUBLIC_BACKEND_URL: https://qxcqywgrw1.c40.airoapp.ai
        run: bash .github/scripts/deploy-godaddy-frontend.sh
